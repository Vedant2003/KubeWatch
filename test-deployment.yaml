
apiVersion: apps/v1
kind: Deployment

metadata:
  name: live-test-nginx
  namespace: default

spec:
  replicas: 5

  selector:
    matchLabels:
      app: live-test-nginx

  template:
    metadata:
      labels:
        app: live-test-nginx

    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
